name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build
        id: build
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      # Publishes the APK as the "latest" release: one tap to download on the phone.
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk Cascade.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Cascade.apk \
            --title "Cascade (latest build)" \
            --notes "Built from ${GITHUB_SHA::7}. Tap Cascade.apk below to download, then open it to install."

      # Saves the build log to the build-logs branch so errors can be read and fixed.
      - name: Save build report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/report
          cp build.log /tmp/report/build.log 2>/dev/null || echo "no build log" > /tmp/report/build.log
          echo "${{ steps.build.outcome }} ${GITHUB_SHA}" > /tmp/report/status.txt
          cd /tmp/report
          git init -q -b build-logs
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "Build ${GITHUB_SHA::7}: ${{ steps.build.outcome }}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" build-logs
