name: Footage

# Push to the "footage" branch to record ad footage on an emulator.
# to the footage-out branch.
on:
  push:
    branches: [footage]

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build
        run: gradle assembleDebug assembleDebugAndroidTest -PscreenshotMode=true --no-daemon
      - name: ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tools/footage.sh
      - name: Save screenshots
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p footage && cd footage
          git init -q -b footage-out
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "Screenshots ${GITHUB_SHA::7}" --allow-empty
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" footage-out
